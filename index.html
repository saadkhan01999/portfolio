    <!-- Apply the saved or system theme before first paint (no flash). Keep in sync with src/store/slices/themeSlice.js. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          // Arriving on a #section link: render deferred sections so the jump lands on target.
          if (location.hash.length > 1) document.documentElement.classList.add('render-all');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0B1020' : '#F7F8FC');
        } catch (e) {}
      })();
    </script>

    <!--
