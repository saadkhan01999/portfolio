<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Saad Bin Saeed Khan</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fc; --fg: #111827; --muted: #596579; --accent: #5b5fef; --on-accent: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #f4f7ff; --muted: #a5b1c7; --accent: #8b8dff; --on-accent: #0b1020; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      p.code { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-size: 0.8rem; }
      h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0.5rem 0 0.75rem; letter-spacing: -0.02em; }
      p { color: var(--muted); line-height: 1.6; max-width: 32rem; margin: 0 auto; }
      a { display: inline-flex; align-items: center; min-height: 2.75rem; margin-top: 1.75rem; padding: 0 1.25rem; border-radius: 0.75rem;
        background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be old or mistyped. Everything lives on the home page — projects, skills and contact details.</p>
      <a href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
